*{

html{

}

body{
  margin:0;

  color:var(--cream);
  font-family:'Manrope',system-ui,sans-serif;
}

.font-display{
  font-family:'Bebas Neue',Impact,sans-serif;

}

  font-family:'Playfair Display',Georgia,serif;
}

.gold-text{
  background:linear-gradient(180deg,#fff3b8 0%,#f5c451 42%,#b67d12 72%,#ffe9a8 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.gold-line{
  height:2px;
  background:linear-gradient(90deg,transparent,#f5c451,transparent);
}

.card{
  background:linear-gradient(180deg,#17130c,#0e0c07);
  border:1px solid var(--line);
  border-radius:22px;
}

.btn-gold{
  background:linear-gradient(180deg,#ffe27a,#e6a91c);
  color:#1a1200;
  box-shadow:0 10px 30px rgba(245,196,81,.28), inset 0 1px 0 #fff;
}

.btn-ghost{
  border:1px solid #4a3a17;
  background:#15110a;
  color:#ffe9a8;
}

.chip{
  border:1px solid #4a3a17;
  background:#17130a;
}

.selected{
  border-color:#f5c451 !important;
  background:linear-gradient(180deg,#2b210d,#171104) !important;
  box-shadow:0 0 0 2px #f5c451, 0 14px 34px rgba(245,196,81,.18);
  color:#fff7d6;
}

@keyframes flame{
  0%,100%{
    transform:scale(1) rotate(-3deg);
  }

  50%{
    transform:scale(1.18) rotate(3deg);
  }
}

.flame{
  animation:flame .55s ease-in-out infinite;
  display:inline-block;
}

.flame-fast{
  animation-duration:.28s;
}

.flame-slow{
  animation-duration:.9s;
}

@keyframes pop{
  0%{
    transform:scale(.85);
    opacity:.4;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

.pop{
  animation:pop .35s ease both;
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1;
  }

  100%{
    transform:translateY(520px) rotate(560deg);
    opacity:0;
  }
}

.confetti{
  position:absolute;
  top:-10px;
  width:9px;
  height:16px;
  animation:fall 2.6s cubic-bezier(.2,.7,.3,1) forwards;
  border-radius:2px;
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(245,196,81,.45);
  }

  50%{
    box-shadow:0 0 0 12px rgba(245,196,81,0);
  }
}

.pulse-gold{
  animation:pulseGold 1.6s infinite;
}

@keyframes livePulse{
  0%,100%{
    box-shadow:0 0 0 0 rgba(47,208,122,.55);
    transform:scale(1);
  }

  50%{
    box-shadow:0 0 0 6px rgba(47,208,122,0);
    transform:scale(1.25);
  }
}

.live-dot{
  animation:livePulse 1.6s ease-in-out infinite;
}

@keyframes marquee{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }

.marquee{
  animation:marquee 22s linear infinite;
